# Dependency updates.
#
# Grouped for minor and patch so each ecosystem produces one pull request a
# week rather than one per dependency. Majors stay separate: they are the ones
# that need reading.
version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, go]
    commit-message:
      prefix: build(deps)
      prefix-development: build(deps-dev)
    groups:
      go-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: [dependencies, docker]
    commit-message:
      prefix: build(deps)
    groups:
      docker-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # Action versions are the one dependency CI cannot test by running an older
  # copy of itself: whatever lands here is what every other job runs on.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, ci]
    commit-message:
      prefix: ci(deps)
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
